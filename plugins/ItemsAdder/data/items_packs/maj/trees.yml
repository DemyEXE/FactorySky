info:
  namespace: maj
items:
  dirt_leaves:
    display_name: display-name-maj-dirt_leaves
    permission: maj.dirt_leaves
    resource:
      material: OAK_LEAVES
      generate: true
      textures:
      - block/dirt/leaves.png
    specific_properties:
      block:
        hardness: 0.2
        cancel_drop: true
        placed_model:
          type: REAL_TRANSPARENT
          break_particles: ITEM
        sound:
          break:
            name: block.grass.break
