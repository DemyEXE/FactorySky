  dirt_mud:
    display_name: display-name-maj-dirt_mud
    permission: maj.dirt_mud
    resource:
      material: END_STONE
      generate: true
      textures:
      - block/dirt/mud.png
    specific_properties:
      block:
        hardness: 0.5
        placed_model:
          type: REAL
          break_particles: ITEM
        break_tools_whitelist:
        - _SHOVEL
        - _shovel
        sound:
          place:
            name: block.mud.place
          break:
